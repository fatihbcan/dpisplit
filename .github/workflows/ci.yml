name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Not gofmt'ed:"; echo "$out"; exit 1; fi

      - name: Unit tests (packet parsing, splitting, DoH)
        run: go test -race -count=1 ./...

      - name: Vet Windows builds
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go vet ./...
          go vet -tags cli ./...

      - name: Build Windows binaries
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dpisplit.exe .
          go build -tags cli -trimpath -ldflags "-s -w" -o dpisplit-cli.exe .
